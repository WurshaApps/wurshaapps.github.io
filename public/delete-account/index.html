<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>حذف الحساب · Delete account — Wursha</title>
        <!-- wursha.com/delete-account: the account-deletion address in the privacy policy and on Google Play.
             The page itself lives on the sign-in domain account.wursha.com (Wursha_QuranHolder repo, firebase-cloud/hosting/);
             this forwards there, keeping ?lang= and #. -->
        <meta http-equiv="refresh" content="0; url=https://account.wursha.com/delete-account" />
        <script>
            location.replace('https://account.wursha.com/delete-account' + location.search + location.hash);
        </script>
        <style>
            body { margin: 0; padding: 48px 16px; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; color: #0b2f36; background: #fff; }
            a { color: #094d59; }
        </style>
    </head>
    <body>
        <p>
            <a href="https://account.wursha.com/delete-account">حذف الحساب</a> ·
            <a href="https://account.wursha.com/delete-account?lang=en" dir="ltr" lang="en">Delete account</a>
        </p>
    </body>
</html>
