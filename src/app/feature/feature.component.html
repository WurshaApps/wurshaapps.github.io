@let f = i18n.t().features;
<section id="features" class="features">
    <div class="container">
        <header class="section-header">
            <h2>{{ f.title }}</h2>
            <p>{{ f.subtitle }}</p>
        </header>

        <div class="features__feature-row">
            <app-placeholder slot="features-overview" kind="wide" label="App overview screenshot — main reading screen" />
        </div>

        <div class="features__grid">
            @for (cat of f.categories; track cat.id) {
                <article class="feat-card" [id]="'feat-' + cat.id">
                    <div class="feat-card__head">
                        <div class="feat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                @for (d of iconFor(cat.id).split('|'); track $index) {
                                    <path [attr.d]="d" />
                                }
                            </svg>
                        </div>
                        <div class="feat-card__count">{{ cat.count }}</div>
                    </div>
                    <h3>{{ cat.title }}</h3>
                    <p class="feat-card__blurb">{{ cat.blurb }}</p>
                    <ul class="feat-card__list">
                        @for (h of cat.highlights; track $index) {
                            <li>{{ h }}</li>
                        }
                    </ul>
                </article>
            }
        </div>
    </div>
</section>
