@let t = i18n.t().downloads;
<article class="dl-card">
    <header class="dl-card__head">
        <img class="dl-card__thumb" [src]="image()" [alt]="name() || ''" loading="lazy" width="64" height="64" />
        <div class="dl-card__title">
            <h3 [style.color]="nameColor()">{{ name() }}</h3>
            @if (description()) {
                <p>{{ description() }}</p>
            }
        </div>
    </header>
    <div class="dl-card__stores">
        @if (android()) {
            <a class="store" [href]="android()" rel="noopener noreferrer" target="_blank" [attr.aria-label]="t.platforms.android">
                <img src="playstore.svg" [alt]="t.platforms.android" />
            </a>
        }
        @if (ios()) {
            <a class="store" [href]="ios()" rel="noopener noreferrer" target="_blank" [attr.aria-label]="t.platforms.ios">
                <img src="appstore.svg" [alt]="t.platforms.ios" />
            </a>
        }
        @if (windows()) {
            <a class="store" [href]="windows()" rel="noopener noreferrer" target="_blank" [attr.aria-label]="t.platforms.windows" [title]="t.winNote">
                <img src="windows.svg" [alt]="t.platforms.windows" />
            </a>
        }
        @if (mac()) {
            <a class="store" [href]="mac()" rel="noopener noreferrer" target="_blank" [attr.aria-label]="t.platforms.mac" [title]="t.macNote">
                <img src="mac.svg" [alt]="t.platforms.mac" />
            </a>
        }
    </div>
</article>
